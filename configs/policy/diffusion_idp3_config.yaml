# =========================================================
# Hydra / basic
# =========================================================
hydra:
  run:
    dir: ./outputs/train_hydra_save/singlerun/${now:%Y%m%d_%H%M%S}
  sweep:
    dir: ./outputs/train_hydra_save/multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra:job.override_dirname}

task: "diffusion_idp3"
method: "baseline"
timestamp: ${now:%Y%m%d_%H%M%S}
repoid: "lerobot/${task}"
root: "/home/wushihan/data/Codes/kuavo_data_challenge_icra/dataset/mini_data_set/task2/lerobot"

# =========================================================
# Training
# =========================================================
training:
  output_directory: "outputs/train/${task}/${method}"
  seed: 42
  max_epoch: 1
  save_freq_epoch: 10
  log_freq: 1
  device: "cuda"
  accumulation_steps: 8
  ema_power: 0.75

  batch_size: 8
  num_workers: 4
  drop_last: False
  max_training_step: null

  resume: false
  resume_timestamp: "run_20260227_112811"

  RGB_Augmenter:
    enable: True
    max_num_transforms: 1
    random_order: True
    tfs:
      notransform: { weight: 3.0, type: "Identity", kwargs: {} }
      brightness: { weight: 1.0, type: "ColorJitter", kwargs: {"brightness": [0.5, 1.5]} }
      contrast: { weight: 1.0, type: "ColorJitter", kwargs: {"contrast": [0.5, 1.5]} }
      saturation: { weight: 1.0, type: "ColorJitter", kwargs: {"saturation": [0.5, 1.5]} }
      hue: { weight: 1.0, type: "ColorJitter", kwargs: {"hue": [-0.05, 0.05]} }
      sharpness: { weight: 1.0, type: "SharpnessJitter", kwargs: {"sharpness": [0.5, 1.5]} }
      random_mask: { weight: 1.0, type: "RandomMask", kwargs: {"mask_size": [0.15, 0.15]} }
      random_border_cutout: { weight: 1.0, type: "RandomBorderCutout", kwargs: {"cut_ratio": 0.15} }
      gaussian_noise: { weight: 1.0, type: "GaussianNoise", kwargs: {"mean": 0.0, "std": 0.1} }
      gamma_correction: { weight: 1.0, type: "GammaCorrection", kwargs: {"gamma": [0.5, 2.0]} }

# =========================================================
# Policy
# =========================================================
policy_name: diffusion_idp3

policy:
  _target_: kuavo_train.wrapper.policy.diffusion_idp3.DiffusionIDP3ConfigWrapper.DiffusionIDP3ConfigWrapper
  n_obs_steps: 2
  horizon: 16
  n_action_steps: 8
  drop_n_last_frames: 7

  vision_backbone: "siglip_only"

  normalization_mapping:
    VISUAL: { _target_: lerobot.configs.types.NormalizationMode, value: IDENTITY }
    RGB: { _target_: lerobot.configs.types.NormalizationMode, value: IDENTITY }
    DEPTH: { _target_: lerobot.configs.types.NormalizationMode, value: IDENTITY }
    STATE: { _target_: lerobot.configs.types.NormalizationMode, value: MIN_MAX }
    ACTION: { _target_: lerobot.configs.types.NormalizationMode, value: MIN_MAX }

  crop_is_random: True
  crop_shape: [420, 560]

  use_amp: False
  spatial_softmax_num_keypoints: 64
  use_separate_rgb_encoder_per_camera: False

  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true

  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0
  num_inference_steps: null
  do_mask_loss_for_padding: false

  optimizer_lr: 0.0001
  optimizer_betas: [0.95, 0.999]
  optimizer_eps: 1.0e-08
  optimizer_weight_decay: 1.0e-03
  scheduler_name: cosine
  scheduler_warmup_steps: 500

  custom:
    # RGB only (SigLIP) + Point Cloud
    use_depth: false
    depth_backbone: resnet18
    use_separate_depth_encoder_per_camera: False
    resize_shape: [224, 224]

    # state token
    use_state_encoder: true
    state_feature_dim: 128

    # denoiser (exactly one should be true)
    use_unet: False
    use_transformer: False
    use_dit: True

    transformer_n_emb: 384
    transformer_n_head: 8
    transformer_n_layer: 12
    transformer_dropout: 0.1
    ddim_eta: 0.1

    # token compression
    use_perceiver: False
    perceiver_num_queries: 256
    perceiver_depth: 2

    # vision backbones + LoRA
    # SigLIP-only RGB encoder (no DFormer/DINO in this policy)
    siglip_model_name: "google/siglip2-base-patch16-224"
    vision_encoder_mode: patches
    use_lora: True
    lora_rank: 16
    lora_alpha: 32
    lora_dropout: 0.05
    vision_freeze: False
    vision_fusion_dim: 256
    vision_attn_heads: 8

    # point cloud (IDP3-style)
    use_point_cloud: true
    point_cloud_keys: ["observation.pc_h", "observation.pc_l", "observation.pc_r"]
    point_cloud_encoder_type: "idp3_multi_stage_pointnet"
    point_cloud_num_points: 1024
    point_cloud_in_channels: 6
    point_cloud_out_channels: 128
    point_cloud_project_dim: 384
    strict_point_cloud_keys: true
    point_cloud_downsample: true
